name: Build and release wheels

# Push a tag like v1.0.7 to build MAVS from source on Windows and Linux,
# bundle the resulting mavs.dll/libmavs.so (+ embree) into the mavspy
# package, and attach both wheels to a new GitHub Release. Version comes
# from the tag itself, so pyproject.toml no longer needs a manual bump.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout mavspy
        uses: actions/checkout@v4

      - name: Checkout mavs source
        uses: actions/checkout@v4
        with:
          repository: Mississippi-State-University-OTM/MAVS
          submodules: recursive
          path: mavs-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Add swap space (Linux)
        # Standard ubuntu-latest runners have 2 cores / 7GB RAM. Building
        # Embree's SIMD kernel variants (SSE4.2/AVX/AVX2) in parallel is
        # memory-hungry enough to OOM at that size without this. Runner
        # images already have their own active swap at /swapfile, so use a
        # distinct path to avoid colliding with it.
        if: matrix.platform == 'linux'
        run: |
          sudo fallocate -l 4G /extra-swapfile
          sudo chmod 600 /extra-swapfile
          sudo mkswap /extra-swapfile
          sudo swapon /extra-swapfile

      - name: Patch vendored CMake policy incompatible with modern CMake
        shell: bash
        run: sed -i '/cmake_policy(SET CMP0063 OLD)/d' mavs-src/extern/tinyxml2/CMakeLists.txt

      - name: Build MAVS and bundle native libraries (Linux)
        # Built inside a manylinux_2_28 container (glibc 2.28 baseline)
        # rather than directly on the ubuntu-latest host: a plain build on
        # ubuntu-latest (glibc ~2.39) or even ubuntu-22.04 (2.35) produced a
        # libmavs.so that refused to load on older-glibc target systems
        # (confirmed: GLIBC_2.38, then GLIBC_2.35 not found errors against a
        # glibc-2.34 test machine). manylinux images exist specifically to
        # build binaries portable across Linux distros. The library-bundling
        # (ldd-based, as before) has to happen inside this same container
        # too, since the actual libjpeg/libX11 files it finds only exist
        # here, not on the ubuntu host. libstdc++/libgcc_s are bundled too
        # (unlike glibc itself, safe/standard practice): this container's
        # newer libstdc++ exports symbols (e.g. __cxa_call_terminate) an
        # older target system's libstdc++.so.6 won't have.
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cat > build_linux.sh <<'SCRIPT'
          set -ex
          dnf install -y libX11-devel libjpeg-turbo-devel cmake gcc-c++ make

          # -static-libstdc++/-static-libgcc: bundling libstdc++.so.6 wasn't
          # enough on its own -- if Python (or something it already loaded,
          # e.g. numpy) pulls in the system's libstdc++.so.6 first, the
          # dynamic loader reuses that existing mapping and never even
          # looks at libmavs.so's RPATH or our bundled copy, since a
          # library with the same SONAME is already resident in the
          # process. Statically linking removes the external dependency
          # entirely rather than trying to win a race for it.
          cmake -S mavs-src -B mavs-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0063=NEW \
            -DCMAKE_POLICY_FORCE_CMP0063=NEW \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_STATIC_LIBS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DMAVS_USE_EMBREE=ON \
            -DMAVS_USE_OMP=ON \
            -DMAVS_USE_MPI=OFF \
            -DMAVS_USE_CHRONO=OFF \
            -DBUILD_TESTING=OFF \
            -DMAVS_BUILD_EXAMPLES=OFF \
            -DMAVS_BUILD_UTILITIES=OFF
          # Building only the "mavs" target works correctly here: Make-
          # generated builds resolve dependencies (e.g. reactphysics3d)
          # correctly for any named target.
          cmake --build mavs-build --config Release --target mavs

          rm -rf src/mavspy/lib && mkdir -p src/mavspy/lib
          # Phase 1: bundle every shared library our own build produced,
          # wherever in the build tree it landed. This has to happen BEFORE
          # running ldd below: right after building, libmavs.so's sibling
          # MAVS-built dependencies (reactphysics3d, tinyxml2, embree) are
          # still scattered across separate build-tree subdirectories, so
          # $ORIGIN can't resolve them yet and ldd silently reports them as
          # "not found" -- which our old filter (grep '^/') then silently
          # dropped instead of bundling. Copying everything self-built
          # first, unconditionally, avoids relying on ldd to find them.
          find mavs-build -iname "lib*.so*" -exec cp {} src/mavspy/lib/ \;

          # Phase 2: now that all self-built libraries are co-located,
          # $ORIGIN resolves correctly, so ldd can find the remaining
          # genuinely-external system dependencies (jpeg, X11, etc.).
          libmavs=src/mavspy/lib/libmavs.so
          ldd "$libmavs" | awk '{print $3}' | grep '^/' | while read -r dep; do
            dest="src/mavspy/lib/$(basename "$dep")"
            if [ -e "$dest" ] && [ "$dep" -ef "$dest" ]; then
              continue
            fi
            case "$(basename "$dep")" in
              libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*.so*|libutil.so*)
                ;;
              *)
                cp "$dep" src/mavspy/lib/ ;;
            esac
          done
          SCRIPT
          chmod +x build_linux.sh
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 bash /work/build_linux.sh

      - name: Configure and build MAVS (Windows)
        # ReactPhysics3D has a known Windows-only build-order issue: a
        # single configure+build leaves mavs.vcxproj linking against
        # reactphysics3d.lib before that project has actually produced it,
        # regardless of --target scope or parallelism (confirmed across
        # several attempts). The proven workaround (used for local Windows
        # builds of this project) is two full passes: build everything
        # static first, then reconfigure for shared and build again -- the
        # second pass's dependency graph resolves correctly.
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          common_flags=(
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            -DCMAKE_POLICY_DEFAULT_CMP0063=NEW
            -DCMAKE_POLICY_FORCE_CMP0063=NEW
            -DCMAKE_BUILD_TYPE=Release
            -DMAVS_USE_EMBREE=ON
            -DMAVS_USE_OMP=ON
            -DMAVS_USE_MPI=OFF
            -DMAVS_USE_CHRONO=OFF
            -DBUILD_TESTING=OFF
            -DMAVS_BUILD_EXAMPLES=OFF
            -DMAVS_BUILD_UTILITIES=OFF
          )

          # Pass 1: static, scoped to just reactphysics3d itself -- the only
          # thing this pass needs to accomplish -- so it can't fail due to
          # mavs.dll (always SHARED regardless of this flag) hitting the
          # same race in this pass too.
          cmake -S mavs-src -B mavs-build "${common_flags[@]}" -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON
          cmake --build mavs-build --config Release --target reactphysics3d

          # Pass 2: shared, full default target -- this is the one that
          # produces mavs.dll.
          cmake -S mavs-src -B mavs-build "${common_flags[@]}" -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=ON
          cmake --build mavs-build --config Release

      - name: Copy native libraries into mavspy package (Windows)
        # Copied straight from the build tree by filename rather than a
        # hardcoded path, since exact output layout depends on generator.
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          rm -rf src/mavspy/lib && mkdir -p src/mavspy/lib
          find mavs-build -iname "mavs.dll" -exec cp {} src/mavspy/lib/ \;
          find mavs-build -iname "embree3.dll" -exec cp {} src/mavspy/lib/ \;

      - name: Set package version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"${version}\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mavspy-wheel-${{ matrix.platform }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mavspy-wheel-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
