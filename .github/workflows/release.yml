name: Build and release wheels

# Push a tag like v1.0.7 to build MAVS from source on Windows and Linux,
# bundle the resulting mavs.dll/libmavs.so (+ embree) into the mavspy
# package, and attach both wheels to a new GitHub Release. Version comes
# from the tag itself, so pyproject.toml no longer needs a manual bump.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout mavspy
        uses: actions/checkout@v4

      - name: Checkout mavs source
        uses: actions/checkout@v4
        with:
          repository: Mississippi-State-University-OTM/MAVS
          submodules: recursive
          path: mavs-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libjpeg-dev

      - name: Add swap space (Linux)
        # Standard ubuntu-latest runners have 2 cores / 7GB RAM. Building
        # Embree's SIMD kernel variants (SSE4.2/AVX/AVX2) in parallel is
        # memory-hungry enough to OOM at that size without this. Runner
        # images already have their own active swap at /swapfile, so use a
        # distinct path to avoid colliding with it.
        if: matrix.platform == 'linux'
        run: |
          sudo fallocate -l 4G /extra-swapfile
          sudo chmod 600 /extra-swapfile
          sudo mkswap /extra-swapfile
          sudo swapon /extra-swapfile

      - name: Patch vendored CMake policy incompatible with modern CMake
        shell: bash
        run: sed -i '/cmake_policy(SET CMP0063 OLD)/d' mavs-src/extern/tinyxml2/CMakeLists.txt

      - name: Configure MAVS
        shell: bash
        run: >
          cmake -S mavs-src -B mavs-build
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_POLICY_DEFAULT_CMP0063=NEW
          -DCMAKE_POLICY_FORCE_CMP0063=NEW
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_STATIC_LIBS=ON
          -DMAVS_USE_EMBREE=ON
          -DMAVS_USE_OMP=ON
          -DMAVS_USE_MPI=OFF
          -DMAVS_USE_CHRONO=OFF
          -DBUILD_TESTING=OFF

      - name: Build MAVS
        # Build only the "mavs" target (what the wheel actually needs)
        # rather than "--target install", which implicitly builds the
        # entire default ALL_BUILD set first -- including every
        # example/utility executable we don't need here. This also means we
        # skip "cmake --install": examples/ and utilities/ each declare
        # their own install(TARGETS ...) rules, which would fail since
        # those executables were never built.
        shell: bash
        run: cmake --build mavs-build --config Release --target mavs --parallel

      - name: Copy native libraries into mavspy package (Windows)
        # Copied straight from the build tree by filename rather than a
        # hardcoded path, since exact output layout depends on generator.
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p src/mavspy/lib
          find mavs-build -iname "mavs.dll" -exec cp {} src/mavspy/lib/ \;
          find mavs-build -iname "embree3.dll" -exec cp {} src/mavspy/lib/ \;

      - name: Copy native libraries into mavspy package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p src/mavspy/lib
          find mavs-build -iname "libmavs.so" -exec cp {} src/mavspy/lib/ \;
          find mavs-build -iname "libembree3.so*" -exec cp {} src/mavspy/lib/ \;

      - name: Set package version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"${version}\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mavspy-wheel-${{ matrix.platform }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mavspy-wheel-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
